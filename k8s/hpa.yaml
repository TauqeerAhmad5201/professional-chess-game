apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chess-game
  namespace: chess-game
  labels:
    app.kubernetes.io/name: chess-game
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chess-game
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
