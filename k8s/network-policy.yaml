apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chess-game
  namespace: chess-game
  labels:
    app.kubernetes.io/name: chess-game
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chess-game
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
