apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chess-game
  labels:
    app: chess-game
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: chess-game.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chess-game
            port:
              number: 80
